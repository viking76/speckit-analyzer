<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#grad)"/>
  <g transform="translate(60, 60)">
    <!-- Graph nodes -->
    <circle cx="-25" cy="-15" r="8" fill="white" opacity="0.9"/>
    <circle cx="15" cy="-15" r="8" fill="white" opacity="0.9"/>
    <circle cx="-5" cy="20" r="8" fill="white" opacity="0.9"/>
    <!-- Edges -->
    <line x1="-17" y1="-15" x2="7" y2="-15" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-17" y1="-15" x2="-5" y2="12" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="7" y1="-15" x2="-5" y2="12" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- Center pulse -->
    <circle cx="-5" cy="-3" r="3" fill="#fde047"/>
  </g>
  <text x="60" y="105" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.8">analyzer</text>
</svg>
