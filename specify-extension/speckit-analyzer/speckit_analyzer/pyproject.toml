[project]
name = "speckit-analyzer"
version = "0.1.0"
description = "Speckit task analyzer: scoring, dependency graph, delegation packaging"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "networkx>=3.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
speckit-analyze = "speckit_analyzer.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["speckit_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true